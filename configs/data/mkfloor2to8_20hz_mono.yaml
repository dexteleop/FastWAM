# Worked example of ta2_mono_template.yaml: MK_tower floors 2-8 @ 20 fps, monocular
# (left-eye) TA2 mosaic. Used by configs/task/mkfloor2to8_20hz_mono.yaml.
#
# Every TA2 camera is side-by-side stereo. The previous mosaic letterboxed the full SBS frame
# into its tile, so 43.8% of the canvas carried a duplicate viewpoint that added no single-eye
# detail. Cropping to the left eye is exact -- head 512x256 -> 256x256 and wrist 256x80 ->
# 128x80 are literal halves, so no resampling happens and per-eye detail is unchanged.
#
# Canvas 384x512 -> 352x256 drops the DiT from 192 to 88 tokens/frame. 352 rather than 336
# because the VAE downsamples by 16 and the DiT then patchifies the latent by 2, so the canvas
# must be a multiple of 32.
#
# Videos come from scripts/transcode.sh with MODE=mono (the *_mono dirs).
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset

  dataset_dirs:
    - ./data/MK_tower_floor2_lerobot_20fps_mono
    - ./data/MK_tower_floor3_lerobot_20fps_mono
    - ./data/MK_tower_floor4_lerobot_20fps_mono
    - ./data/MK_tower_floor5_lerobot_20fps_mono
    - ./data/MK_tower_floor6_lerobot_20fps_mono
    - ./data/MK_tower_floor7_lerobot_20fps_mono
    - ./data/MK_tower_floor8_lerobot_20fps_mono

  shape_meta:
    images:
      - key: head_camera
        raw_shape: [3, 256, 256]
        shape: [3, 256, 256]

      - key: left_color
        raw_shape: [3, 80, 128]
        shape: [3, 80, 128]

      - key: right_color
        raw_shape: [3, 80, 128]
        shape: [3, 80, 128]

    # action / state shape_meta come from configs/lift/{on,off,legacy}.yaml (replaced
    # wholesale). The kinco channel is constant 0 here, so the task config pins lift=off.

  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4

  video_size: [352, 256]
  concat_multi_camera: null

  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  max_padding_retry: 3

  pretrained_norm_stats: null

  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor

    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}

    num_output_cameras: 1
    camera_mosaic: ta2
    ta2_canvas_size: [352, 256]
    ta2_head_tile: [256, 256]
    ta2_wrist_tile: [80, 128]
    ta2_fill: 0.5

    # action_output_dim / proprio_output_dim / action_state_transforms also come from
    # configs/lift/{on,off,legacy}.yaml.
    delta_action_dim_mask: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor

    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor

  text_embedding_cache_dir: ./data/text_embeds_cache/mkfloor2to8_20hz
  context_len: 128
