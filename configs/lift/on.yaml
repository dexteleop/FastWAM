# @package _global_
# ^ A hydra directive, not a comment. Without it the keys below nest under `lift.` and never
#   reach data.train.
#
# Lifting column (kinco) ON: action 17-d / state 14-d
#
#   action 17-d = [L_arm(7), L_grip, R_arm(7), R_grip, lift_vel_cmd]
#   state  14-d = [L_arm(7), R_arm(7)]
#
# Why the action carries the lift but the state does not
# ------------------------------------------------------
# The state-feedback table in the developer docs (§4.8) lists only arm / gripper / chassis
# joint_states -- there is no lift state topic, so on the robot that state channel can only
# be filled with 0 (see client/arm_config.yml, lift.state_topic). In the training data it is a
# live signal with a lag-0 correlation of 0.9978 to the command, so the model copies it
# instead of reading the images; at deploy time the constant 0 reads as "column stationary"
# and the policy never moves it. Keeping the lift on the output side only removes both the
# shortcut and the train/deploy skew.
#
# The old semantics (action 17 / state 15) are lift=legacy; see the deprecation note on
# include_lift in transforms/teleavatar.py. Only for reproducing runs from before 2026-09-12.
#
# Literals only -- no ${eval:...} / ${sum_shapes:...}. serve_policy.py does not call
# register_default_resolvers(), so a custom resolver fails at hydra compose time on the
# deploy side.
#
# Hydra replaces lists rather than merging them, so shape_meta and action_state_transforms
# are spelled out in full, not just the entry that differs.

data:
  train:
    shape_meta:
      action:
        - key: default
          raw_shape: 72
          shape: 17          # 16 + lift command
      state:
        - key: default
          raw_shape: 72
          shape: 14          # both arms' joints, no lift feedback

    processor:
      # Through configs/model/fastwam.yaml these set the shapes of ActionDiT's
      # action_encoder / head and the proprio_encoder; they must match shape above.
      action_output_dim: 17
      proprio_output_dim: 14

      action_state_transforms:
        - _target_: fastwam.datasets.lerobot.transforms.teleavatar.TeleavatarSelectTransform
          keys: [default]
          convert_gripper_to_trigger: true
          lift_in_action: true
          lift_in_state: false
